<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cult Group — онбординг Sales</title>
  <meta name="description" content="Ежедневный онбординг Sales Cult Group — один шаг в день." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ivory: #F7F7F6;
      --white: #FFFFFF;
      --graphite: #1A1A1A;
      --muted: #6B6B6B;
      --tertiary: #A0A0A0;
      --border: #E8E8E8;
      --accent: #2563EB;
      --lime: #BFFF00;
      --lavender: #A78BFA;
      --shadow: 4px 4px 0 #1A1A1A;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      letter-spacing: -0.02em;
      background: var(--ivory);
      color: var(--graphite);
      line-height: 1.5;
      min-height: 100vh;
    }
    .shell { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    .brand-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--lavender), var(--accent));
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }
    .mono-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    h1 {
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 6px 0 0;
    }
    .progress-num {
      font-family: "JetBrains Mono", monospace;
      font-size: 28px;
      font-weight: 800;
      text-align: right;
      line-height: 1;
    }
    .progress-label { font-size: 11px; color: var(--tertiary); text-align: right; }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-today {
      border-color: var(--graphite);
      box-shadow: var(--shadow);
    }
    .date-line {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--lavender);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .intro { font-size: 14px; color: var(--muted); margin: 0 0 20px; }
    .task-list { list-style: none; margin: 0; padding: 0; }
    .task-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .task-list li:last-child { border-bottom: none; }
    .task-list label { flex: 1; cursor: pointer; color: var(--graphite); }
    .task-list input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--graphite); }
    .task-list li.done label { color: var(--tertiary); text-decoration: line-through; }
    .links { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .links h3 {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .links a {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 6px;
    }
    .links a:hover { text-decoration: underline; }
    .panel { margin-top: 16px; }
    .panel h3 {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .mini-grid {
      display: grid;
      gap: 8px;
    }
    .mini-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      background: var(--ivory);
    }
    .mini-card strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .mini-card span { color: var(--muted); }
    .rules-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
    .rules-list li { margin-bottom: 6px; }
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
    }
    .dot.done { background: var(--lavender); }
    .dot.today { background: var(--graphite); box-shadow: 0 0 0 2px var(--lime); }
    .dot.future { background: transparent; border: 1px solid var(--border); }
    .footer-note { text-align: center; font-size: 12px; color: var(--tertiary); margin-top: 12px; }
    .warn {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: var(--graphite);
      margin-bottom: 16px;
    }
    .wait-card { text-align: center; padding: 32px 20px; }
    .wait-card h2 {
      font-family: "JetBrains Mono", monospace;
      font-size: 18px;
      margin: 0 0 8px;
    }
    .complete-banner {
      background: rgba(191, 255, 0, 0.35);
      border: 1px solid var(--graphite);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 16px;
      display: none;
    }
    .complete-banner.visible { display: block; }
    #loadError {
      display: none;
      background: #FEE2E2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand-bar"></div>
    <div id="loadError">Не удалось загрузить программу. Обнови страницу или напиши CRO.</div>

    <header class="header">
      <div>
        <div class="mono-tag">Cult Group · Sales onboarding</div>
        <h1 id="pageTitle">Сегодня</h1>
      </div>
      <div>
        <div class="progress-num" id="progressNum">—</div>
        <div class="progress-label">день</div>
      </div>
    </header>

    <div id="waitView" class="card wait-card" style="display:none">
      <h2 id="waitTitle">Онбординг скоро</h2>
      <p id="waitText" class="intro" style="margin:0"></p>
    </div>

    <div id="todayView">
      <article class="card card-today" id="stepCard">
        <div class="date-line" id="dateLine">—</div>
        <h2 id="stepTitle" style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800;margin:0 0 12px">—</h2>
        <p class="intro" id="stepIntro"></p>
        <ul class="task-list" id="taskList"></ul>
        <div class="links" id="linksBlock" style="display:none">
          <h3>Ссылки</h3>
          <div id="linksList"></div>
        </div>
        <div id="panels"></div>
        <div class="complete-banner" id="completeBanner">Все задачи дня отмечены ✓</div>
      </article>
    </div>

    <div class="dots" id="progressDots"></div>
    <p class="footer-note" id="footerNote">Показывается только шаг текущего дня</p>
  </div>

  <script>
    const STORAGE_KEY = "cult_leonid_daily_v2";

    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
      catch { return {}; }
    }
    function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    function parseDate(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDateRu(dateStr, weekday) {
      const d = parseDate(dateStr);
      const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","окtober","ноября","декабря"];
      const fix = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
      return (weekday ? weekday + " · " : "") + d.getDate() + " " + fix[d.getMonth()];
    }

    function todayLocal() {
      const n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate());
    }

    function dayIndexFromStart(startDate, today) {
      const start = parseDate(startDate);
      const diff = Math.floor((today - start) / 86400000);
      return diff;
    }

    function renderPanels(panelIds, teamRes) {
      const el = document.getElementById("panels");
      el.innerHTML = "";
      if (!panelIds || !panelIds.length) return;

      panelIds.forEach(id => {
        const wrap = document.createElement("div");
        wrap.className = "panel";

        if (id === "team_staff") {
          wrap.innerHTML = "<h3>Штат (кратко)</h3>";
          const grid = document.createElement("div");
          grid.className = "mini-grid";
          teamRes.people
            .filter(p => p.id !== "leonid" && (p.category || "staff") === "staff")
            .slice(0, 8)
            .forEach(p => {
              const c = document.createElement("div");
              c.className = "mini-card";
              c.innerHTML = "<strong>" + p.name + "</strong><span>" + p.role + "</span>";
              grid.appendChild(c);
            });
          wrap.appendChild(grid);
        }

        if (id === "products") {
          wrap.innerHTML = "<h3>Маршрутизация</h3><ul class='rules-list'>" +
            "<li><strong>Cult</strong> — реклама, съёмка + ИИ (от ~5 млн ₽)</li>" +
            "<li><strong>Blaster</strong> — CG, motion, мультимедиа (от сотен тысяч)</li>" +
            "<li><strong>Sputnik</strong> — док, спецпроекты (от ~1 млн; «берём» — Сергей)</li>" +
            "<li><strong>Неясно</strong> → преза Cult Group</li></ul>";
        }

        if (id === "partner_slz") {
          wrap.innerHTML = "<h3>Партнёрские SLZ</h3>";
          const grid = document.createElement("div");
          grid.className = "mini-grid";
          teamRes.people.filter(p => p.category === "partner_slz").forEach(p => {
            const c = document.createElement("div");
            c.className = "mini-card";
            c.innerHTML = "<strong>" + p.name + "</strong><span>" + p.role + "</span>";
            grid.appendChild(c);
          });
          const note = teamRes.org.partner_slz;
          if (note) {
            const p = document.createElement("p");
            p.style.cssText = "font-size:12px;color:var(--muted);margin:10px 0 0";
            p.textContent = note.routing || note.desc;
            wrap.appendChild(p);
          }
          wrap.insertBefore(grid, wrap.querySelector("p"));
        }

        if (id === "rules_short") {
          wrap.innerHTML = "<h3>Правила (кратко)</h3><ul class='rules-list'>" +
            "<li>Квалиф. бриф → скоринг ≥ 5 → квал. лид</li>" +
            "<li>Handoff = договор + предоплата</li>" +
            "<li>Internal first на кросс-проектах</li>" +
            "<li>Не исчезай после КП</li>" +
            "<li>Стоп: казино, букмекеры, алкоголь, политика</li></ul>";
        }

        el.appendChild(wrap);
      });
    }

    function renderDots(steps, currentIdx, state) {
      const dots = document.getElementById("progressDots");
      dots.innerHTML = "";
      steps.forEach((step, i) => {
        const d = document.createElement("div");
        d.className = "dot";
        d.title = "День " + step.id;
        const tasks = state["step_" + step.id] || {};
        const allDone = step.tasks.every(t => tasks[t.id]);
        if (allDone) d.classList.add("done");
        if (i === currentIdx) d.classList.add("today");
        if (i > currentIdx) d.classList.add("future");
        dots.appendChild(d);
      });
    }

    async function init() {
      let stepsData, teamRes;
      try {
        [stepsData, teamRes] = await Promise.all([
          fetch("data/steps.json").then(r => { if (!r.ok) throw new Error(); return r.json(); }),
          fetch("data/team.json").then(r => { if (!r.ok) throw new Error(); return r.json(); })
        ]);
      } catch (e) {
        document.getElementById("loadError").style.display = "block";
        return;
      }

      const { meta, steps } = stepsData;
      const today = todayLocal();
      const dayIdx = dayIndexFromStart(meta.startDate, today);
      const start = parseDate(meta.startDate);

      if (dayIdx < 0) {
        document.getElementById("todayView").style.display = "none";
        document.getElementById("waitView").style.display = "block";
        document.getElementById("waitTitle").textContent = "Старт " + formatDateRu(meta.startDate);
        document.getElementById("waitText").textContent = "Онбординг откроется в первый рабочий день. До встречи!";
        document.getElementById("progressNum").textContent = "0";
        document.getElementById("pageTitle").textContent = "Ждём старт";
        return;
      }

      const currentIdx = Math.min(dayIdx, steps.length - 1);
      const step = steps[currentIdx];
      const state = loadState();

      document.getElementById("pageTitle").textContent = "Сегодня";
      document.getElementById("progressNum").textContent = String(step.id);
      document.getElementById("dateLine").textContent = formatDateRu(step.date, step.weekday);
      document.getElementById("stepTitle").textContent = step.title;
      document.getElementById("stepIntro").textContent = step.intro;

      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";
      const stepTasks = state["step_" + step.id] || {};

      step.tasks.forEach(task => {
        const li = document.createElement("li");
        if (stepTasks[task.id]) li.classList.add("done");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!stepTasks[task.id];
        cb.addEventListener("change", () => {
          const s = loadState();
          s["step_" + step.id] = s["step_" + step.id] || {};
          s["step_" + step.id][task.id] = cb.checked;
          saveState(s);
          li.classList.toggle("done", cb.checked);
          updateCompleteBanner(step, s);
          renderDots(steps, currentIdx, s);
        });
        const label = document.createElement("label");
        label.appendChild(cb);
        label.appendChild(document.createTextNode(task.text));
        li.appendChild(label);
        taskList.appendChild(li);
      });

      const linksBlock = document.getElementById("linksBlock");
      const linksList = document.getElementById("linksList");
      linksList.innerHTML = "";
      if (step.links && step.links.length) {
        linksBlock.style.display = "block";
        step.links.forEach(l => {
          const a = document.createElement("a");
          a.href = l.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = l.label;
          linksList.appendChild(a);
        });
      } else {
        linksBlock.style.display = "none";
      }

      renderPanels(step.panels, teamRes);
      updateCompleteBanner(step, state);
      renderDots(steps, currentIdx, state);

      if (dayIdx >= steps.length) {
        document.getElementById("footerNote").textContent =
          "Программа онбординга завершена. Вопросы — к коммерческому директору.";
      } else if (previewStep !== null) {
        document.getElementById("footerNote").textContent =
          "Режим preview (CRO). Убери ?preview= из URL для боевого режима.";
      } else if (dayIdx > currentIdx) {
        document.getElementById("footerNote").textContent =
          "Ты впереди календаря — показан последний день программы.";
      }
    }

    function updateCompleteBanner(step, state) {
      const tasks = state["step_" + step.id] || {};
      const allDone = step.tasks.every(t => tasks[t.id]);
      document.getElementById("completeBanner").classList.toggle("visible", allDone);
    }

    init();
  </script>
</body>
</html>
