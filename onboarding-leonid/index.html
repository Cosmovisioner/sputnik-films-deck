<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Cult Group — онбординг продаж</title>
  <meta name="description" content="Онбординг продаж Cult Group: программа по дням, карта группы, люди, чаты, презентации." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loadError" class="load-error" hidden>
    Не удалось загрузить данные. Обнови страницу (Cmd+Shift+R) или напиши Диме.
  </div>

  <header class="top-bar">
    <div class="top-inner">
      <div class="brand">
        <div class="brand-gradient"></div>
        <div>
          <span class="mono-tag">Cult Group · онбординг</span>
          <h1 class="brand-title">Леонид · продажи</h1>
        </div>
      </div>
      <div class="xp-block">
        <div class="xp-num" id="xpNum">0%</div>
        <div class="xp-label">прогресс</div>
      </div>
    </div>

    <nav class="main-nav" id="mainNav" aria-label="Разделы">
      <button type="button" data-view="program" class="nav-tab active">Программа</button>
      <button type="button" data-view="map" class="nav-tab">Карта группы</button>
      <button type="button" data-view="people" class="nav-tab">Люди</button>
      <button type="button" data-view="chats" class="nav-tab">Telegram</button>
      <button type="button" data-view="decks" class="nav-tab">Презентации</button>
    </nav>

    <div class="day-nav-wrap" id="dayNavWrap">
      <div class="day-nav" id="dayNav" aria-label="Дни программы"></div>
    </div>
  </header>

  <main class="shell" id="mainContent"></main>

  <footer class="site-footer">
    <span id="footerNote">Cult Group · v20260711-v7</span>
  </footer>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="personModal">
      <button type="button" class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
